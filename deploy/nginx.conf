# Koog web demo: nginx serves the static files and proxies the API and MCP routes to the Node server on 127.0.0.1:8787.
# Conservative rate limits: a few real visitors are fine, but one client (or a crowd) can't spam it.
# A full teacher-demo visit is ~25 requests; repeat visits hit the browser cache for /assets/.
# Privacy: no access log, no request lines in the error log, and the visitor's address is not passed to Node.

# Fly's proxy sends the visitor's real address in Fly-Client-IP (nginx itself only sees the proxy). Fly's edge sets this
# header itself, replacing anything the client sent, so it can't be spoofed from the internet; only traffic that skips
# the proxy (Fly's private network) lacks it, and then the connection's own address is the key.
map $http_fly_client_ip $client_key { "" $binary_remote_addr; default $http_fly_client_ip; }
map $host $all_key { default all; }

# Methods: static files are GET/HEAD only. POST is allowed on /mcp and /api/link; OPTIONS (CORS preflight) on the API routes.
map "$request_method:$uri" $method_ok {
  default 0;
  "~^(GET|HEAD):"                          1;
  "~^(POST|OPTIONS):/mcp/?$"               1;
  "~^POST:/api/link/?$"                    1;
  "~^OPTIONS:/(api(/.*)?|openapi\.json|llms\.txt)$" 1;
}

# POST /mcp only (an empty key is not counted, so CORS preflights don't use it up)
map $request_method $mcp_post_key { POST $client_key; default ""; }

limit_req_zone $client_key zone=perip:10m rate=3r/s;    # any static file, per visitor
limit_req_zone $client_key zone=pages:10m rate=20r/m;   # HTML pages, per visitor
limit_req_zone $all_key    zone=total:1m  rate=20r/s;   # everyone together
limit_req_zone $client_key zone=apiip:10m rate=30r/m;   # API and MCP, per visitor
limit_req_zone $all_key    zone=apitotal:1m rate=5r/s;  # API and MCP, everyone together
limit_req_zone $mcp_post_key zone=mcppost:10m rate=20r/m; # MCP calls, per visitor (a session start is ~3-5 calls)
limit_conn_zone $client_key zone=conn:10m;
limit_conn_zone $client_key zone=apiconn:10m;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;

server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  # behind the Fly proxy: redirects (e.g. /teacher -> /teacher/) must not carry nginx's internal port
  absolute_redirect off;
  port_in_redirect off;
  server_tokens off;
  access_log off;
  error_log /dev/stderr crit;

  # small, short-lived requests only: tiny header buffers (a URI or header line over 4k is refused), short timeouts
  client_max_body_size 1k;
  client_header_buffer_size 1k;
  large_client_header_buffers 4 4k;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 15s;
  keepalive_timeout 15s;
  keepalive_requests 200;
  reset_timedout_connection on;
  # any other method (TRACE, PUT, DELETE, PATCH...) gets a small JSON 405; bodies over the limit a JSON 413
  if ($method_ok = 0) { return 405; }
  error_page 405 @e405;
  error_page 413 @e413;
  error_page 400 494 @e400; # oversized headers (Node's own 400s pass through untouched); a URI over 4k gets nginx's plain 414

  limit_conn conn 8;
  limit_req zone=perip burst=40 nodelay;
  limit_req zone=total burst=60 nodelay;

  gzip on;
  gzip_proxied any;
  gzip_types text/css text/plain application/javascript image/svg+xml application/json;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  # shared by every proxied route: HTTP/1.1 to Node, a bounded wait, and no visitor address or cookies passed along
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For "";
  proxy_set_header Fly-Client-IP "";
  proxy_set_header Forwarded "";
  proxy_set_header X-Real-IP "";
  proxy_set_header Cookie "";
  proxy_set_header Authorization "";
  proxy_connect_timeout 3s;
  proxy_send_timeout 10s;
  proxy_read_timeout 15s; # Node answers in milliseconds and gives up on any request after 15 s

  # (add_header in a location replaces the server's list, so each one repeats the headers it needs)
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; }
  # pages: "/" and "/teacher/" are matched exactly (their index.html redirect isn't limited again)
  location ~ (^/$|^/teacher/$|\.html$) {
    limit_req zone=pages burst=10 nodelay;
    limit_req zone=perip burst=40 nodelay;
    limit_req zone=total burst=60 nodelay;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # same-origin scripts only (no inline script); inline styles are used; the teacher page frames ../?embed&play
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  }

  # ---- MCP: POST JSON-RPC, answered as plain JSON (no long-lived streams), so buffering is off only to be safe ----
  location ~ ^/mcp/?$ {
    limit_req zone=mcppost burst=12 nodelay;
    limit_req zone=apiip burst=20 nodelay;
    limit_req zone=apitotal burst=30 nodelay;
    limit_conn apiconn 4;
    client_max_body_size 64k;
    client_body_buffer_size 64k; # keep bodies in memory, never in temp files
    error_page 429 @api429;
    error_page 413 @e413;
    proxy_pass http://127.0.0.1:8787;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 20s;
  }
  # ---- REST API: GET/HEAD, plus POST on /api/link ----
  location ^~ /api {
    limit_req zone=apiip burst=20 nodelay;
    limit_req zone=apitotal burst=30 nodelay;
    limit_conn apiconn 4;
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    error_page 429 @api429;
    error_page 413 @e413;
    proxy_pass http://127.0.0.1:8787;
  }
  # ---- discovery files and health check (static-like limits) ----
  location = /openapi.json { limit_req zone=perip burst=10 nodelay; limit_req zone=total burst=60 nodelay; proxy_pass http://127.0.0.1:8787; }
  location = /llms.txt     { limit_req zone=perip burst=10 nodelay; limit_req zone=total burst=60 nodelay; proxy_pass http://127.0.0.1:8787; }
  location = /healthz      { limit_req zone=perip burst=10 nodelay; limit_req zone=total burst=60 nodelay; proxy_pass http://127.0.0.1:8787; }

  location / { try_files $uri $uri/ =404; }

  error_page 429 /429.txt;
  location = /429.txt { internal; default_type text/plain; return 429 "Too many requests. Please wait a minute and try again.\n"; }
  location @api429 {
    default_type application/json;
    add_header Access-Control-Allow-Origin * always;
    add_header Retry-After 30 always;
    add_header X-Content-Type-Options nosniff always;
    return 429 '{"error":"Too many requests. Please wait a minute and try again."}';
  }
  location @e400 {
    default_type application/json;
    add_header Access-Control-Allow-Origin * always;
    add_header X-Content-Type-Options nosniff always;
    return 400 '{"error":"Bad request (URL or headers too large)"}';
  }
  location @e405 {
    default_type application/json;
    add_header Access-Control-Allow-Origin * always;
    add_header X-Content-Type-Options nosniff always;
    add_header Allow "GET, HEAD, POST, OPTIONS" always;
    return 405 '{"error":"Method not allowed"}';
  }
  location @e413 {
    default_type application/json;
    add_header Access-Control-Allow-Origin * always;
    add_header X-Content-Type-Options nosniff always;
    return 413 '{"error":"Body too large (64 KB max on /mcp and /api/link)"}';
  }
}
