# Koog web demo: static files only, no sign-in. Conservative rate limits so a few real visitors are fine
# but one client (or a crowd) can't spam it. A full teacher-demo visit is ~25 requests; repeat visits
# hit the browser cache for /assets/.

# Fly's proxy sends the visitor's real address in Fly-Client-IP (nginx itself only sees the proxy).
map $http_fly_client_ip $client_key { "" $binary_remote_addr; default $http_fly_client_ip; }
map $host $all_key { default all; }

limit_req_zone $client_key zone=perip:10m rate=3r/s;    # any file, per visitor
limit_req_zone $client_key zone=pages:10m rate=20r/m;   # HTML pages, per visitor
limit_req_zone $all_key    zone=total:1m  rate=20r/s;   # everyone together
limit_conn_zone $client_key zone=conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  # behind the Fly proxy: redirects (e.g. /teacher -> /teacher/) must not carry nginx's internal port
  absolute_redirect off;
  port_in_redirect off;
  server_tokens off;

  client_max_body_size 1k;
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }

  limit_conn conn 8;
  limit_req zone=perip burst=40 nodelay;
  limit_req zone=total burst=60 nodelay;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff always; }
  # pages: "/" and "/teacher/" are matched exactly (their index.html redirect isn't limited again)
  location ~ (^/$|^/teacher/$|\.html$) {
    limit_req zone=pages burst=10 nodelay;
    limit_req zone=perip burst=40 nodelay;
    limit_req zone=total burst=60 nodelay;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }
  location / { try_files $uri $uri/ =404; }
  error_page 429 /429.txt;
  location = /429.txt { internal; default_type text/plain; return 429 "Too many requests. Please wait a minute and try again.\n"; }
}
