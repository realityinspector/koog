server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff always; }
  location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
  location / { try_files $uri $uri/ =404; }
}
