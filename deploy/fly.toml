# Fly.io app for the hosted web demo (static files from `npm run build:web`, served by nginx).
# Deploy with: npm run deploy:fly
app = 'koog-demo'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  # one small machine, and a cap on how much it handles at once (extra requests wait or are refused)
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 25
    hard_limit = 50

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
