<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Setup at home: one computer with Chrome or Edge, an optional USB-MIDI keyboard, speakers or headphones. A grown-up starts Koog once; each child picks a code word.</title>
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1430"/><stop offset="1" stop-color="#2b1a40"/></linearGradient>
    <linearGradient id="hsun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc35a"/><stop offset="1" stop-color="#ff6f61"/></linearGradient>
    <marker id="har" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5fffd0"/></marker>
  </defs>
  <rect width="960" height="440" rx="20" fill="url(#hbg)"/>
  <text x="40" y="52" font-size="26" font-weight="800" fill="#fff">🏠 Setup at home</text>
  <text x="40" y="80" font-size="15" fill="#cfc8f0">About 10 minutes, once. After that it's one click to play.</text>

  <!-- illustration: laptop + keyboard + headphones -->
  <g transform="translate(40 110)">
    <rect x="40" y="0" width="250" height="150" rx="10" fill="#2f2a4d" stroke="#8b7bff" stroke-width="2"/>
    <rect x="54" y="14" width="222" height="122" rx="4" fill="#120f24"/>
    <rect x="62" y="22" width="206" height="70" rx="3" fill="#6d2bd9"/>
    <circle cx="120" cy="52" r="12" fill="#ffc35a" opacity=".9"/><circle cx="170" cy="44" r="8" fill="#5fffd0" opacity=".9"/><circle cx="215" cy="58" r="10" fill="#ff6f61" opacity=".9"/>
    <g fill="#f4f2ff"><rect x="62" y="100" width="206" height="28" rx="2"/></g>
    <path d="M77 100v28M92 100v28M107 100v28M122 100v28M137 100v28M152 100v28M167 100v28M182 100v28M197 100v28M212 100v28M227 100v28M242 100v28M257 100v28" stroke="#120f24" stroke-width="1"/>
    <path d="M20 150h290l-20 14H40z" fill="#4a4370"/>
    <text x="165" y="186" text-anchor="middle" font-size="13" fill="#cfc8f0">Computer: Chrome or Edge</text>

    <!-- USB cable -->
    <path d="M300 150 C330 150 330 238 360 238" fill="none" stroke="#5fffd0" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="338" y="200" font-size="12" fill="#5fffd0" transform="rotate(-70 338 200)">USB</text>

    <!-- MIDI keyboard -->
    <rect x="360" y="212" width="280" height="56" rx="8" fill="#2f2a4d" stroke="#ffc35a" stroke-width="2"/>
    <rect x="372" y="232" width="256" height="28" rx="2" fill="#f4f2ff"/>
    <path d="M388 232v28M404 232v28M420 232v28M436 232v28M452 232v28M468 232v28M484 232v28M500 232v28M516 232v28M532 232v28M548 232v28M564 232v28M580 232v28M596 232v28M612 232v28" stroke="#2f2a4d" stroke-width="1"/>
    <path d="M384 232v16M400 232v16M428 232v16M444 232v16M460 232v16M492 232v16M508 232v16M540 232v16M556 232v16M572 232v16M604 232v16M620 232v16" stroke="#120f24" stroke-width="7"/>
    <circle cx="380" cy="222" r="4" fill="#ff6f61"/><circle cx="394" cy="222" r="4" fill="#5fffd0"/>
    <text x="500" y="290" text-anchor="middle" font-size="13" fill="#cfc8f0">Any USB-MIDI keyboard (optional)</text>

    <!-- headphones -->
    <path d="M410 120a36 36 0 0 1 72 0" fill="none" stroke="#ff5da2" stroke-width="7" stroke-linecap="round"/>
    <rect x="400" y="114" width="16" height="30" rx="7" fill="#ff5da2"/><rect x="476" y="114" width="16" height="30" rx="7" fill="#ff5da2"/>
    <text x="446" y="170" text-anchor="middle" font-size="13" fill="#cfc8f0">Speakers or</text>
    <text x="446" y="186" text-anchor="middle" font-size="13" fill="#cfc8f0">headphones</text>
  </g>

  <!-- steps -->
  <g transform="translate(700 110)" font-size="14" fill="#f4f2ff">
    <rect x="0" y="0" width="230" height="262" rx="14" fill="#2f2a4d"/>
    <g font-weight="800" fill="#ffc35a" font-size="16"><text x="18" y="34">1</text><text x="18" y="94">2</text><text x="18" y="154">3</text><text x="18" y="214">4</text></g>
    <text x="40" y="34" font-weight="700">Install Node, then run</text>
    <text x="40" y="54" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#5fffd0">npm install · npm start</text>
    <text x="40" y="94" font-weight="700">Plug in the keyboard</text>
    <text x="40" y="114" fill="#cfc8f0" font-size="13">or use the computer keys</text>
    <text x="40" y="154" font-weight="700">Open Koog in Chrome</text>
    <text x="40" y="174" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#5fffd0">localhost:5173</text>
    <text x="40" y="214" font-weight="700">Each kid picks a code word</text>
    <text x="40" y="234" fill="#cfc8f0" font-size="13">siblings keep their own stars</text>
  </g>
  <text x="40" y="424" font-size="13" fill="#9f97c9">Grown-ups: hold the 🔒 button for Boss mode (studio, DJ, looper). Volume is capped, and nothing leaves the computer.</text>
</svg>
