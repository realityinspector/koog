<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Setup in a classroom or computer lab: host one built copy of Koog on the school's HTTPS web server, or run it on each computer. Each station has a computer, an optional USB-MIDI keyboard and headphones. The teacher projects Koog for demos. Progress stays on each computer.</title>
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1430"/><stop offset="1" stop-color="#1c2a3a"/></linearGradient>
    <g id="station">
      <rect x="0" y="0" width="120" height="74" rx="7" fill="#2f2a4d" stroke="#8b7bff" stroke-width="1.5"/>
      <rect x="8" y="8" width="104" height="44" rx="3" fill="#6d2bd9"/>
      <circle cx="36" cy="28" r="7" fill="#ffc35a" opacity=".9"/><circle cx="66" cy="24" r="5" fill="#5fffd0" opacity=".9"/><circle cx="92" cy="32" r="6" fill="#ff6f61" opacity=".9"/>
      <rect x="8" y="56" width="104" height="12" rx="1" fill="#f4f2ff"/>
      <rect x="10" y="84" width="100" height="18" rx="4" fill="#2f2a4d" stroke="#ffc35a" stroke-width="1.5"/>
      <rect x="15" y="88" width="90" height="10" rx="1" fill="#f4f2ff"/>
      <path d="M100 10a14 14 0 0 1 28 0" fill="none" stroke="#ff5da2" stroke-width="4" stroke-linecap="round" transform="translate(-6 -16)"/>
      <rect x="90" y="-12" width="7" height="13" rx="3" fill="#ff5da2"/><rect x="115" y="-12" width="7" height="13" rx="3" fill="#ff5da2"/>
    </g>
  </defs>
  <rect width="960" height="460" rx="20" fill="url(#cbg)"/>
  <text x="40" y="52" font-size="26" font-weight="800" fill="#fff">🏫 Setup in a classroom or computer lab</text>
  <text x="40" y="80" font-size="15" fill="#cfc8f0">Headphones at every station. One copy of Koog serves the whole room.</text>

  <!-- server -->
  <g transform="translate(40 118)">
    <rect x="0" y="0" width="190" height="150" rx="14" fill="#2f2a4d" stroke="#5fd3c6" stroke-width="2"/>
    <rect x="22" y="20" width="146" height="22" rx="4" fill="#120f24"/><circle cx="36" cy="31" r="4" fill="#5fffd0"/><path d="M50 31h100" stroke="#3a3466" stroke-width="4"/>
    <rect x="22" y="50" width="146" height="22" rx="4" fill="#120f24"/><circle cx="36" cy="61" r="4" fill="#5fffd0"/><path d="M50 61h100" stroke="#3a3466" stroke-width="4"/>
    <text x="95" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">School web server</text>
    <text x="95" y="120" text-anchor="middle" font-size="12" fill="#cfc8f0">HTTPS, static files only</text>
    <text x="95" y="138" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#5fffd0">npm run build → dist/</text>
  </g>
  <path d="M232 193 C270 193 270 150 300 150" fill="none" stroke="#5fffd0" stroke-width="2.5" stroke-dasharray="6 5"/>
  <path d="M232 193 C270 193 270 290 300 290" fill="none" stroke="#5fffd0" stroke-width="2.5" stroke-dasharray="6 5"/>

  <!-- stations grid -->
  <use href="#station" x="310" y="114"/><use href="#station" x="450" y="114"/><use href="#station" x="590" y="114"/>
  <use href="#station" x="310" y="254"/><use href="#station" x="450" y="254"/><use href="#station" x="590" y="254"/>
  <text x="520" y="384" text-anchor="middle" font-size="13" fill="#cfc8f0">Each station: computer (Chrome or Edge) + USB-MIDI keyboard (optional) + headphones</text>

  <!-- teacher -->
  <g transform="translate(740 114)">
    <rect x="0" y="0" width="180" height="110" rx="8" fill="#f4f2ff" opacity=".92"/>
    <rect x="10" y="10" width="160" height="90" rx="4" fill="#6d2bd9"/>
    <text x="90" y="52" text-anchor="middle" font-size="22" font-weight="800" fill="#ffc35a">Cadence!</text>
    <text x="90" y="76" text-anchor="middle" font-size="12" fill="#fff">projector</text>
    <text x="90" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Teacher station</text>
    <text x="90" y="156" text-anchor="middle" font-size="12" fill="#cfc8f0">demo a move, then</text>
    <text x="90" y="172" text-anchor="middle" font-size="12" fill="#cfc8f0">"Can you make Koog say it?"</text>
  </g>

  <!-- tips -->
  <g font-size="13" fill="#d9d3f7">
    <text x="40" y="306" font-weight="700" fill="#ffc35a">No server?</text>
    <text x="40" y="324">Run npm start on each</text>
    <text x="40" y="341">computer instead.</text>
  </g>
  <g font-size="13" fill="#d9d3f7">
    <text x="40" y="418"><tspan font-weight="700" fill="#ffc35a">Good to know: </tspan>Web MIDI needs HTTPS (or localhost). Progress is saved per code word on each computer, so students should return to the same station.</text>
    <text x="40" y="438">No accounts, no student data leaves the computer. Pairs can share a station in DJ + Piano mode with a DJ controller.</text>
  </g>
</svg>
